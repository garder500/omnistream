name: Release

# Publie une release GitHub (brouillon) avec les installeurs Windows, macOS et
# Linux ainsi que le manifeste latest.json utilisé par l'updater.
# Déclenché par un tag de version : git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le tag et la clé publique de l'updater
        shell: bash
        run: |
          version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version $version de tauri.conf.json" >&2
            exit 1
          fi
          if grep -q REMPLACER_PAR_LA_CLE_PUBLIQUE src-tauri/tauri.conf.json; then
            echo "La clé publique de l'updater est encore le placeholder (voir README, section Release)" >&2
            exit 1
          fi

      - name: Dépendances système (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé privée de signature de l'updater (secrets GitHub, jamais dans le dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Omnistream ${{ github.ref_name }}"
          releaseBody: "Voir les ressources ci-dessous pour installer Omnistream."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
