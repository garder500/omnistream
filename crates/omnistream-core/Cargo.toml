[package]
name = "omnistream-core"
version = "0.1.0"
edition = "2021"
description = "Logique métier d'Omnistream (domaine, connecteurs, modération, streaming, base locale), indépendante de Tauri."

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
bytes = "1"
rml_rtmp = "0.8"
getrandom = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws", "query"] }
