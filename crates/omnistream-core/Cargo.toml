[package]
name = "omnistream-core"
version = "0.1.0"
edition = "2021"
description = "Logique métier d'Omnistream (domaine, connecteurs, modération, streaming, base locale), indépendante de Tauri."

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
