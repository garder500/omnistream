[package]
name = "omnistream"
version = "0.1.0"
edition = "2021"
description = "Omnistream : multi-stream, chat unifié et modération depuis une seule interface."

[lib]
name = "omnistream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omnistream-core = { path = "../crates/omnistream-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
